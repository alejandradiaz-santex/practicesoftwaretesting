name: Playwright Tests

# Corre los tests en cada pull request (a cualquier rama) y guarda el reporte solo si fallan.
on:
  pull_request:

# Si se sube otro commit al mismo PR, cancela la corrida anterior:
# cada corrida crea una orden y una cuenta en el sitio demo.
concurrency:
  group: playwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Playwright (chromium)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Solo chromium: TC-001 crea una orden y TC-002 una cuenta en cada corrida.
      # Para correr los tres navegadores, quitar --project y la instalación acotada de arriba.
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
