name: Playwright Tests

# Corre la suite completa (incluye tests/QATES/) en cada pull request hacia main y en cada push a main,
# sin intervencion manual. Los datos de prueba estan versionados en tests/data/.
# Para bloquear el merge: proteger la rama main y exigir el check "Playwright Tests / test".
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Si se sube otro commit al mismo PR, cancela la corrida anterior.
concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps firefox
    - name: Run Playwright tests
      run: npx playwright test --project=firefox
    # Genera un borrador BUG-CI por cada fallo y el resumen del job. Los tests omitidos por
    # Cloudflare solo avisan: no hacen fallar el check.
    - name: Generar reportes
      if: ${{ !cancelled() }}
      run: node scripts/reporte/generar-reportes.js
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        # El sufijo es el número de ejecución (1, y 2 si se relanza): con upload-artifact@v4 un nombre
        # repetido dentro de la misma corrida da error, y así se conservan las evidencias de cada intento.
        name: playwright-report-${{ github.run_attempt }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    # Borradores de bug (formato de docs/bugs/BUG-001.md) en un artefacto aparte.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: reportes-ci-${{ github.run_attempt }}
        path: test-results/bugs/
        if-no-files-found: ignore
        retention-days: 30
